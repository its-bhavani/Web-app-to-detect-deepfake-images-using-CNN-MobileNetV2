<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <div class="container">
        <h1 class="title">Deepfake Detection Web App</h1>
        <p class="subtitle">Upload an image to check if it's real or deepfake.</p>

        <form action="/" method="POST" enctype="multipart/form-data">
            <div class="upload-box">
                <input type="file" name="file" class="form-control" required>
                <button type="submit" class="btn-upload">Upload & Detect</button>
            </div>
        </form>

        {% if result %}
            <div class="result-box {% if 'Deepfake' in result %}deepfake{% else %}real{% endif %}">
                <h2>{{ result }}</h2>
            </div>
            {% if image %}
                <img src="{{ image }}" class="uploaded-image" alt="Uploaded Image">
            {% endif %}
        {% endif %}
    </div>

</body>
</html>
